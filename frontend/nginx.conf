server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Must be at least MAX_UPLOAD_MB (50) so large PDFs reach the backend's own check.
    client_max_body_size 55m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat answers stream as Server-Sent Events: don't buffer them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # nginx's default mime.types doesn't know .mjs; browsers refuse to load
    # the pdf.js worker module if it's served as application/octet-stream.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/login, /notebooks/:id) all serve the SPA.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
