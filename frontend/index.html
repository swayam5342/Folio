<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Folio — chat with your PDFs and get answers cited to the page." />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Mirrors src/lib/theme.ts.
      try {
        const root = document.documentElement
        let pref = localStorage.getItem('folio-theme')
        if (pref !== 'light' && pref !== 'dark' && pref !== 'aurora') {
          pref = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        root.dataset.theme = pref
        if (localStorage.getItem('folio-calm') === '1') root.setAttribute('data-calm', '')
      } catch {}
    </script>
    <title>Folio</title>
  </head>
  <body class="grain">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
