[project]
name = "notebooklm-rag"
version = "0.1.0"
description = "Folio: a NotebookLM-style app for chatting with your PDFs, with page-level citations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.142.2",
    "groq>=1.7.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "rapidocr-onnxruntime>=1.4.4",
    "sentence-transformers>=6.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "torch>=2.14",
    "uvicorn[standard]>=0.54.0",
]

# Docker (Linux) uses CPU-only PyTorch: the default Linux wheels bundle ~2.5 GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
