name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest, eval smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ragpass
          POSTGRES_DB: folio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raguser -d folio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://raguser:ragpass@localhost:5432/folio_test
      TEST_DATABASE_URL: postgresql+asyncpg://raguser:ragpass@localhost:5432/folio_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      GROQ_API_KEY: ci-unused
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Migrate test database
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing:skip-covered
      - name: Cache embedding and reranker models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5-ms-marco-MiniLM-L6-v2
      - name: Evaluation (smoke, no LLM)
        run: uv run python -m eval.run_eval --smoke

  frontend:
    name: Frontend (oxlint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npx vite build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
